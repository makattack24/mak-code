<div class="contact-page-bg">
	<div class="contact-container">
		<h2>Get in Touch</h2>
		<p class="welcome-message">
			Need help building a website, fixing a bug, or tackling a coding
			challenge? I'd love to hear from you. Drop me a message and I'll get
			back to you as soon as I can.
		</p>
		<form
			*ngIf="!submitted"
			(ngSubmit)="onSubmit()"
			#contactForm="ngForm"
			autocomplete="off"
		>
			<div class="form-group">
				<label for="name">Name</label>
				<input
					id="name"
					name="name"
					type="text"
					class="form-control"
					required
					[(ngModel)]="name"
					placeholder="e.g. Jane Smith"
				/>
			</div>
			<div class="form-group">
				<label for="email">Email</label>
				<input
					id="email"
					name="email"
					type="email"
					class="form-control"
					required
					[(ngModel)]="email"
					placeholder="e.g. jane@company.com"
				/>
			</div>
			<div class="form-group">
				<label for="message">Message</label>
				<textarea
					id="message"
					name="message"
					class="form-control"
					required
					rows="5"
					[(ngModel)]="message"
					placeholder="Tell me about your project or question — the more detail, the better!"
				></textarea>
			</div>
			<div *ngIf="error" class="error">{{ error }}</div>
			<button type="submit" class="btn btn-primary" [disabled]="submitting">
				{{ submitting ? 'Sending...' : 'Send Message' }}
			</button>
		</form>
		<div *ngIf="submitted" class="success-message">
			<h3>Message Sent!</h3>
			<p>Thanks for reaching out — I'll get back to you shortly.</p>
		</div>
	</div>
</div>
