<div class="calc-wrapper" tabindex="0" (keydown)="onKey($event)">
	<div class="calc-body">
		<!-- Screen -->
		<div class="calc-screen">
			<span class="calc-history">{{ expression }}</span>
			<span class="calc-value">{{ display || '0' }}</span>
		</div>

		<!-- Pad -->
		<div class="calc-pad">
			<!-- Row 1 -->
			<button class="key key--fn key--wide" (click)="clear()">AC</button>
			<button class="key key--fn" (click)="backspace()">
				<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
					<line x1="18" y1="9" x2="12" y2="15"/>
					<line x1="12" y1="9" x2="18" y2="15"/>
				</svg>
			</button>
			<button class="key key--op" (click)="press('/')">&divide;</button>

			<!-- Row 2 -->
			<button class="key" (click)="press('7')">7</button>
			<button class="key" (click)="press('8')">8</button>
			<button class="key" (click)="press('9')">9</button>
			<button class="key key--op" (click)="press('*')">&times;</button>

			<!-- Row 3 -->
			<button class="key" (click)="press('4')">4</button>
			<button class="key" (click)="press('5')">5</button>
			<button class="key" (click)="press('6')">6</button>
			<button class="key key--op" (click)="press('-')">&minus;</button>

			<!-- Row 4 -->
			<button class="key" (click)="press('1')">1</button>
			<button class="key" (click)="press('2')">2</button>
			<button class="key" (click)="press('3')">3</button>
			<button class="key key--op" (click)="press('+')">+</button>

			<!-- Row 5 -->
			<button class="key key--fn" (click)="press('%')">%</button>
			<button class="key" (click)="press('0')">0</button>
			<button class="key" (click)="press('.')">.</button>
			<button class="key key--eq" (click)="press('=')">=</button>
		</div>
	</div>
</div>
