<div class="apps-page">
	<!-- App Launcher (shown when no app is active) -->
	<div *ngIf="!activeApp" class="app-launcher">
		<div class="launcher-header">
			<h1>Apps</h1>
			<p class="launcher-subtitle">Pick an app to launch</p>
		</div>
		<div class="app-grid">
			<button
				*ngFor="let app of apps"
				class="app-card"
				(click)="openApp(app)"
			>
				<div class="app-icon">
					<i [class]="app.icon"></i>
				</div>
				<span class="app-name">{{ app.name }}</span>
				<span class="app-desc">{{ app.description }}</span>
			</button>
		</div>
	</div>

	<!-- Active App View -->
	<div class="app-view" [class.active]="activeApp">
		<div *ngIf="activeApp" class="app-view-header">
			<button class="back-btn" (click)="closeApp()">
				<i class="fa-solid fa-arrow-left"></i> Apps
			</button>
			<span class="active-app-name">{{ activeApp }}</span>
		</div>
		<div class="app-view-content">
			<router-outlet></router-outlet>
		</div>
	</div>
</div>
