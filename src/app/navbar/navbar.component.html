<nav class="navbar">
	<div class="nav-inner">
		<!-- Logo -->
		<a class="nav-logo" routerLink="/home" (click)="closeMenu()">
			tech<span class="accent">with</span>mak
		</a>

		<!-- Desktop Links -->
		<ul class="nav-links">
			<li *ngFor="let link of navLinks">
				<a
					[routerLink]="link.path"
					routerLinkActive="active"
					class="nav-link"
				>
					<i [class]="link.icon"></i>
					{{ link.label }}
				</a>
			</li>
		</ul>

		<!-- Right side: auth + theme toggle + terminal toggle + mobile hamburger -->
		<div class="nav-actions">
			<!-- Admin link (desktop) -->
			<a
				*ngIf="isAdmin$ | async"
				routerLink="/admin"
				routerLinkActive="active"
				class="nav-link admin-link"
			>
				<i class="fa-solid fa-shield-halved"></i>
				Admin
			</a>

			<!-- Login / Logout (desktop) -->
			<a
				*ngIf="!(isLoggedIn$ | async)"
				routerLink="/login"
				routerLinkActive="active"
				class="nav-link login-link"
			>
				<i class="fa-solid fa-right-to-bracket"></i>
				Login
			</a>
			<button
				*ngIf="isLoggedIn$ | async"
				class="nav-link logout-btn"
				(click)="logout()"
			>
				<i class="fa-solid fa-right-from-bracket"></i>
				Logout
			</button>

			<!-- Profile avatar (desktop) -->
			<a
				*ngIf="isLoggedIn$ | async"
				routerLink="/profile"
				class="nav-avatar-link"
				title="My Profile"
			>
				<img
					*ngIf="(currentUser$ | async)?.avatar_url"
					[src]="(currentUser$ | async)?.avatar_url"
					alt="Profile"
					class="nav-avatar-img"
				/>
				<span
					*ngIf="!(currentUser$ | async)?.avatar_url"
					class="nav-avatar-fallback"
				>{{ getInitials((currentUser$ | async)?.name) }}</span>
			</a>

			<button
				class="terminal-toggle"
				(click)="toggleTerminal.emit()"
				[attr.aria-label]="terminalVisible ? 'Hide terminal' : 'Show terminal'"
				[title]="terminalVisible ? 'Hide terminal' : 'Show terminal'"
			>
				<i class="fa-solid fa-terminal"></i>
				<i [class]="terminalVisible ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"
					style="font-size: 0.6rem; margin-left: -2px;"></i>
			</button>
			<app-themetoggle></app-themetoggle>
			<button
				class="hamburger"
				(click)="toggleMenu()"
				[attr.aria-expanded]="mobileMenuOpen"
				aria-label="Toggle navigation menu"
			>
				<span class="bar" [class.open]="mobileMenuOpen"></span>
				<span class="bar" [class.open]="mobileMenuOpen"></span>
				<span class="bar" [class.open]="mobileMenuOpen"></span>
			</button>
		</div>
	</div>

	<!-- Mobile Menu -->
	<div class="mobile-menu" [class.open]="mobileMenuOpen">
		<a
			*ngFor="let link of navLinks"
			[routerLink]="link.path"
			routerLinkActive="active"
			class="mobile-link"
			(click)="closeMenu()"
		>
			<i [class]="link.icon"></i>
			{{ link.label }}
		</a>

		<!-- Admin link (mobile) -->
		<a
			*ngIf="isAdmin$ | async"
			routerLink="/admin"
			routerLinkActive="active"
			class="mobile-link"
			(click)="closeMenu()"
		>
			<i class="fa-solid fa-shield-halved"></i>
			Admin
		</a>

		<!-- Login / Logout (mobile) -->
		<a
			*ngIf="!(isLoggedIn$ | async)"
			routerLink="/login"
			routerLinkActive="active"
			class="mobile-link"
			(click)="closeMenu()"
		>
			<i class="fa-solid fa-right-to-bracket"></i>
			Login
		</a>
		<a
			*ngIf="isLoggedIn$ | async"
			routerLink="/profile"
			routerLinkActive="active"
			class="mobile-link"
			(click)="closeMenu()"
		>
			<i class="fa-solid fa-user"></i>
			Profile
		</a>
		<a
			*ngIf="isLoggedIn$ | async"
			class="mobile-link"
			(click)="logout()"
		>
			<i class="fa-solid fa-right-from-bracket"></i>
			Logout
		</a>
	</div>
</nav>
